name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Laravel tests + Vite build (PHP 8.2)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ruangcloud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ruangcloud/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test
