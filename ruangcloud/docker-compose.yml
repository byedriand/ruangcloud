# RuangCloud di Docker — jalankan dari root proyek:
#   docker compose up -d --build
# Aplikasi: http://localhost:8080 | Node: :8081 (Server 1), :8082 (Server 2), :8083 (Server 3) | Redis: :6380 | PostgreSQL: :5433
name: ruangcloud

services:
  # ── Aplikasi Laravel (PHP-FPM) ──────────────────────────────────────
  app:
    build:
      context: .
      target: app
    image: ruangcloud-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ruangcloud
      DB_USERNAME: ruangcloud
      DB_PASSWORD: ruangcloud-secret
      APP_URL: http://localhost:8080
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage/app
      - node-jakarta:/var/www/html/storage/app/nodes/jakarta
      - node-bandung:/var/www/html/storage/app/nodes/bandung
      - node-surabaya:/var/www/html/storage/app/nodes/surabaya
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Worker antrean (replikasi file antar node) ──────────────────────
  worker:
    build:
      context: .
      target: app
    image: ruangcloud-app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=300"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ruangcloud
      DB_USERNAME: ruangcloud
      DB_PASSWORD: ruangcloud-secret
      APP_URL: http://localhost:8080
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage/app
      - node-jakarta:/var/www/html/storage/app/nodes/jakarta
      - node-bandung:/var/www/html/storage/app/nodes/bandung
      - node-surabaya:/var/www/html/storage/app/nodes/surabaya
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # ── Web server Nginx ────────────────────────────────────────────────
  web:
    build:
      context: .
      target: web
    image: ruangcloud-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app

  # ── Database PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruangcloud
      POSTGRES_USER: ruangcloud
      POSTGRES_PASSWORD: ruangcloud-secret
    ports:
      - "5433:5432"
    volumes:
      - db-pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruangcloud -d ruangcloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Redis (antrean + cache) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── 3 node penyimpanan terdistribusi ────────────────────────────────
  # Tiap node = container Nginx yang menyajikan volumenya sendiri.
  # Volume yang sama juga dipasang ke container app di path yang selama
  # ini dipakai aplikasi (storage/app/nodes/<kode>), jadi kode aplikasi
  # tidak berubah: menulis ke folder node = menulis ke container node.
  node-jakarta:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - node-jakarta:/data
      - ./docker/node.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

  node-bandung:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - node-bandung:/data
      - ./docker/node.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"

  node-surabaya:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - node-surabaya:/data
      - ./docker/node.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8083:80"

volumes:
  db-data:
  db-pgsql-data:
  redis-data:
  app-storage:
  node-jakarta:
  node-bandung:
  node-surabaya:
