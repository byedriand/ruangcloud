# RuangCloud di Docker — jalankan dari root proyek:
#   docker compose up -d --build
# Aplikasi: http://localhost:8080 | MinIO: API :9000, Konsol :9001 | Redis: :6380 | PostgreSQL: :5433 | Mailpit (email lokal): http://localhost:8025
name: ruangcloud

services:
  # ── Aplikasi Laravel (PHP-FPM) ──────────────────────────────────────
  app:
    build:
      context: .
      target: app
    image: ruangcloud-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ruangcloud
      DB_USERNAME: ruangcloud
      DB_PASSWORD: ruangcloud-secret
      APP_URL: http://localhost:8080
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      AWS_ACCESS_KEY_ID: ruangcloud
      AWS_SECRET_ACCESS_KEY: ruangcloud-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: noreply@ruangcloud.id
      MAIL_FROM_NAME: RuangCloud
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # ── Worker antrean (replikasi file antar node) ──────────────────────
  worker:
    build:
      context: .
      target: app
    image: ruangcloud-app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=300"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ruangcloud
      DB_USERNAME: ruangcloud
      DB_PASSWORD: ruangcloud-secret
      APP_URL: http://localhost:8080
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      AWS_ACCESS_KEY_ID: ruangcloud
      AWS_SECRET_ACCESS_KEY: ruangcloud-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: noreply@ruangcloud.id
      MAIL_FROM_NAME: RuangCloud
    volumes:
      - ./.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  # ── Web server Nginx ────────────────────────────────────────────────
  web:
    build:
      context: .
      target: web
    image: ruangcloud-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app

  # ── Database PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruangcloud
      POSTGRES_USER: ruangcloud
      POSTGRES_PASSWORD: ruangcloud-secret
    ports:
      - "5433:5432"
    volumes:
      - db-pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruangcloud -d ruangcloud"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Redis (antrean + cache) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Mailpit: penangkap email lokal ──────────────────────────────────
  # Semua email keluar aplikasi (mis. tautan reset kata sandi REQ-F-05)
  # masuk ke kotak masuk web Mailpit di http://localhost:8025; tidak ada
  # email yang benar-benar terkirim keluar. Di produksi, arahkan
  # MAIL_HOST/MAIL_PORT ke SMTP asli — kode tidak berubah.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # ── MinIO: cluster node penyimpanan (S3) ────────────────────────────
  # Tiap storage node = satu bucket MinIO bernama sesuai kode node
  # (jakarta, bandung, surabaya). Aplikasi mengaksesnya lewat API S3
  # (service "minio", port 9000); isi bucket dapat diintip dari konsol
  # web MinIO di http://localhost:9001 (masuk: ruangcloud / ruangcloud-secret).
  # Image server memakai pgsty/silo (fork komunitas MinIO): image resmi
  # minio/minio dan minio/mc dihapus dari Docker Hub sejak September 2026.
  # API S3, variabel MINIO_*, perintah server, dan konsolnya identik.
  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ruangcloud
      MINIO_ROOT_PASSWORD: ruangcloud-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # ── Pembuat bucket node (sekali jalan, lalu berhenti) ───────────────
  # Container app menunggu service ini selesai (depends_on
  # service_completed_successfully) agar bucket node sudah ada sebelum
  # aplikasi menerima unggahan pertama. Status "Exited (0)" di
  # docker compose ps adalah normal untuk service ini.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set lokal http://minio:9000 ruangcloud ruangcloud-secret; do
        echo "Menunggu MinIO siap..."; sleep 2; done;
        mc mb --ignore-existing lokal/jakarta &&
        mc mb --ignore-existing lokal/bandung &&
        mc mb --ignore-existing lokal/surabaya

volumes:
  db-data:
  db-pgsql-data:
  redis-data:
  app-storage:
  minio-data:
  # Volume node lokal lama (era sebelum MinIO) — tidak lagi dipakai,
  # dipertahankan agar data lama tidak ikut terhapus (rollback manual).
  node-jakarta:
  node-bandung:
  node-surabaya:
